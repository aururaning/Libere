<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" fill="none" role="img" aria-labelledby="scene-title scene-description">
  <title id="scene-title">Libere 自由画布概念示意</title>
  <desc id="scene-description">一份关于梯度下降的示例讲义、一张问题批注和一个 Python 验证卡片，通过蓝色虚线连接在同一张留白充足的画布上。这是原创概念插画，并非应用截图。</desc>
  <defs>
    <linearGradient id="scene-paper" x1="60" y1="0" x2="1040" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfcfe"/><stop offset="1" stop-color="#f1f4f9"/>
    </linearGradient>
    <pattern id="scene-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2657c7" fill-opacity=".10"/>
    </pattern>
    <filter id="scene-shadow" x="-20%" y="-20%" width="150%" height="155%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#233b64" flood-opacity=".09"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#233b64" flood-opacity=".05"/>
    </filter>
    <filter id="scene-soft-shadow" x="-20%" y="-30%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#233b64" flood-opacity=".07"/>
    </filter>
  </defs>
  <g font-family="PingFang SC, -apple-system, BlinkMacSystemFont, system-ui, sans-serif">
    <rect x="12" y="12" width="1076" height="676" rx="30" fill="url(#scene-paper)"/>
    <rect x="13" y="13" width="1074" height="674" rx="29" stroke="#e5eaf2"/>
    <rect x="32" y="32" width="1036" height="636" rx="18" fill="url(#scene-dots)"/>
    <text x="68" y="60" font-size="17" letter-spacing="1.2" fill="#6c778a">LIBERE <tspan letter-spacing="0"> / 自由画布概念示意</tspan></text>

    <!-- Relationships live behind the documents, not above their text. -->
    <g stroke="#2657c7" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 9" opacity=".50">
      <path d="M404 305 C453 292 412 205 460 195"/>
      <path d="M667 271 C654 306 706 303 680 334"/>
      <path d="M311 550 C310 560 312 568 311 579"/>
    </g>
    <path d="M929 144 C965 145 989 170 984 202" stroke="#2657c7" stroke-width="2" stroke-linecap="round" opacity=".24"/>
    <path d="M970 195 L984 204 L994 188" stroke="#2657c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".24"/>

    <!-- An original teaching example, not a screenshot of a real PDF. -->
    <g transform="translate(70 124) rotate(-3 168 215)">
      <rect width="336" height="430" rx="19" fill="white" filter="url(#scene-shadow)"/>
      <rect x=".5" y=".5" width="335" height="429" rx="18.5" stroke="#e3e8f0"/>
      <path d="M28 29 H41 L47 35 V48 H28 Z M41 29 V36 H47" stroke="#2657c7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="45" font-size="18" font-weight="600" fill="#2657c7">PDF · 课堂讲义</text>
      <text x="28" y="94" font-size="30" font-weight="650" fill="#172033">理解梯度下降</text>
      <text x="28" y="135" font-size="20" fill="#566074">把复杂问题，拆成小步。</text>
      <rect x="24" y="156" width="270" height="31" rx="5" fill="#2657c7" fill-opacity=".07"/>
      <text x="30" y="179" font-size="19" fill="#26334b">目标：让误差逐步变小</text>
      <text x="30" y="231" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#172033">θ ← θ − α∇L(θ)</text>
      <g transform="translate(30 262)">
        <text x="0" y="0" font-size="17" fill="#7b8494">误差</text>
        <path d="M13 15 V102 H276" stroke="#d5ddea" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M14 22 C38 25 52 40 71 60 S114 86 149 93 S218 98 267 98" stroke="#2657c7" stroke-width="3" stroke-linecap="round"/>
        <path d="M14 22 C38 25 52 40 71 60 S114 86 149 93 S218 98 267 98 L267 102 H14 Z" fill="#2657c7" fill-opacity=".05"/>
        <g fill="white" stroke="#2657c7" stroke-width="2">
          <circle cx="36" cy="31" r="4"/><circle cx="71" cy="60" r="4"/><circle cx="114" cy="85" r="4"/><circle cx="183" cy="96" r="4"/>
        </g>
      </g>
      <text x="28" y="405" font-size="17" fill="#7b8494">原文件索引，不必再复制一份</text>
      <circle cx="336" cy="190" r="7" fill="white" stroke="#2657c7" stroke-width="2"/>
      <circle cx="230" cy="430" r="6" fill="white" stroke="#2657c7" stroke-width="2"/>
    </g>

    <!-- An informal ink-like underline connects the question to the lecture. -->
    <g transform="translate(460 86) rotate(2 176 92)">
      <rect width="352" height="184" rx="19" fill="#f9fbff" filter="url(#scene-shadow)"/>
      <rect x=".75" y=".75" width="350.5" height="182.5" rx="18.25" stroke="#2657c7" stroke-opacity=".20" stroke-width="1.5"/>
      <text x="27" y="39" font-size="18" font-weight="600" fill="#2657c7">我的批注</text>
      <text x="27" y="85" font-size="26" font-weight="500" fill="#172033">学习率太大，</text>
      <text x="27" y="123" font-size="26" font-weight="500" fill="#172033">会不会跨过最优点？</text>
      <path d="M27 141 C82 136 165 140 240 137 M32 147 C95 143 168 145 224 142" stroke="#2657c7" stroke-width="2.6" stroke-linecap="round" opacity=".72"/>
      <circle cx="0" cy="115" r="7" fill="white" stroke="#2657c7" stroke-width="2"/>
      <circle cx="210" cy="184" r="6" fill="white" stroke="#2657c7" stroke-width="2"/>
    </g>

    <!-- A code card feels like a piece of content, without fabricated app chrome. -->
    <g transform="translate(540 337) rotate(2 215 142)">
      <rect width="430" height="284" rx="20" fill="white" filter="url(#scene-shadow)"/>
      <rect x=".5" y=".5" width="429" height="283" rx="19.5" stroke="#e3e8f0"/>
      <path d="M30 27 L22 35 L30 43 M44 27 L52 35 L44 43 M39 24 L34 46" stroke="#2657c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="42" font-size="18" font-weight="600" fill="#2657c7">Notebook · 快速验证</text>
      <text x="27" y="85" font-size="26" font-weight="600" fill="#172033">用代码，检验一个想法</text>
      <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19.5" fill="#273247">
        <text x="28" y="125"><tspan fill="#2657c7">rate</tspan> = 0.1</text>
        <text x="28" y="156">theta -= rate * gradient</text>
        <text x="28" y="187">loss = model.evaluate()</text>
      </g>
      <rect x="25" y="208" width="380" height="50" rx="10" fill="#2657c7" fill-opacity=".055"/>
      <path d="M43 233 L48 238 L58 227" stroke="#2657c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="240" font-size="19" fill="#536179">每一步，都留下思考的痕迹。</text>
      <circle cx="135" cy="0" r="6" fill="white" stroke="#2657c7" stroke-width="2"/>
    </g>

    <g transform="translate(115 575) rotate(-1 185 42)">
      <rect width="370" height="84" rx="16" fill="white" filter="url(#scene-soft-shadow)"/>
      <rect x=".5" y=".5" width="369" height="83" rx="15.5" stroke="#e3e8f0"/>
      <text x="23" y="36" font-size="23" font-weight="550" fill="#172033">连接资料，也连接你的理解。</text>
      <text x="23" y="64" font-size="17" fill="#7b8494">文件索引 · 自由排布 · 独立批注</text>
      <circle cx="192" cy="0" r="5" fill="white" stroke="#2657c7" stroke-width="1.8"/>
    </g>
  </g>
</svg>
